<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/style.css">
    <title>🛍️ Velora</title>
</head>
<body>
    <!-- start header section -->
    <header>
        <p>Free shipping on orders over 50$</p>
    </header>
    <!-- end header section -->

    <!-- start navbar section -->
    <nav>
        <img src="./assets/images/logo.png" alt="logo.png">
        <ul>
            <li class="home"><a href="#">Home</a></li>
            <li><a href="#">Shop</a></li>
            <li><a href="#">Categories</a></li>
            <li><a href="#">Details</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        <div class="icons">
            <div class="search-icon">
                <input type="text" placeholder="Search for products...">
                <i class='bx bx-search'></i>
            </div>
    <i class='bx bx-user'></i>
    <i class='bx bx-heart'></i>
    <i class='bx bx-shopping-bag'></i>
</div>
    </nav>
    <!-- end navbar section -->

    <!-- start banner section -->
    <section class="banner">
        <div class="banner-options">
        <p>NEW COLLECTION</p>
        <h1>Discover Your<br> Perfect Style</h1>
        <span>Shop the latest trends in fashion,<br> and accessories.</span>
                <div class="banner-button">
        <button>Shop Now</button>
        <button>View Collection</button>
        </div>
        </div>

        <div class="banner-pic">
        <img src="./assets/images/banner-image.jfif" alt="banner-image">
            <div class="banner-off">
                <img src="./assets/images/percent-image.jfif" alt="percent-image">
            <div>
            <p>Summer Sale</p>
            <span>Up to 40% Off</span>
            </div>
        </div>
        </div>
    </section>
    <!-- end banner section -->
</body>
</html>
